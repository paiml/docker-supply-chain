[package]
name = "pinscan"
version = "0.1.0"
edition = "2021"
description = "Pin and SBOM checker used to teach container supply-chain security"
license = "MIT"
publish = false
exclude = ["scripts/", "contracts/", ".github/"]

[lib]
name = "pinscan"
path = "src/lib.rs"

[[bin]]
name = "pinscan"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[workspace]
